{% comment %}
JS for estimator/_module_rows_editor.html. A separate include (rather than folded into
the same partial) so it lands inside each page's own {% block extra_js %} rather than
nested inside another <script> tag. Include once, on the same page as the editor
partial above.
{% endcomment %}
<script>
    const SEGMENTS = {{ segments_json|safe }};
    const MODULE_TYPES = {{ module_types_json|safe }};
    const COMPLEXITY_LEVELS = {{ complexity_levels_json|safe }};
    const EXISTING_MODULES = {{ existing_modules_json|safe }};
    const EXISTING_ZONES = {{ existing_zones_json|safe }};
    const PROJECT_COMPLEXITY_ID = {{ project_complexity_id }};

    // Zone names come from user-uploaded files or free-typed input (not staff-managed
    // master data like Segments/Module Types), so they're escaped before ever landing
    // in innerHTML.
    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
    }

    document.getElementById('moduleRowsZoneSuggestions').innerHTML = EXISTING_ZONES.map(z => `<option value="${escapeHtml(z)}">`).join('');

    const complexityById = {};
    COMPLEXITY_LEVELS.forEach(c => complexityById[c.id] = c);

    function segmentOptionsHtml(selectedId) {
        let html = '<option value="">-- select --</option>';
        SEGMENTS.forEach(s => {
            const sel = (String(s.id) === String(selectedId)) ? 'selected' : '';
            html += `<option value="${s.id}" ${sel}>${s.name}</option>`;
        });
        return html;
    }

    function moduleTypeOptionsHtml(selectedId) {
        let html = '<option value="">-- select --</option>';
        MODULE_TYPES.forEach(m => {
            const sel = (String(m.id) === String(selectedId)) ? 'selected' : '';
            html += `<option value="${m.id}" ${sel}>${m.name}</option>`;
        });
        return html;
    }

    function complexityOptionsHtml(selectedId) {
        let html = `<option value="">Inherit (${complexityById[PROJECT_COMPLEXITY_ID] ? complexityById[PROJECT_COMPLEXITY_ID].name : ''})</option>`;
        COMPLEXITY_LEVELS.forEach(c => {
            const sel = (String(c.id) === String(selectedId)) ? 'selected' : '';
            html += `<option value="${c.id}" ${sel}>${c.name} (x${c.multiplier})</option>`;
        });
        return html;
    }

    function hydrateExistingRows() {
        const rows = document.querySelectorAll('#moduleRowsBody .module-row');
        rows.forEach((tr, i) => {
            const data = EXISTING_MODULES[i];
            tr.querySelector('.segment-select').innerHTML = segmentOptionsHtml(data ? data.segment_id : '');
            tr.querySelector('.module-type-select').innerHTML = moduleTypeOptionsHtml(data ? data.module_type_id : '');
            tr.querySelector('.complexity-select').innerHTML = complexityOptionsHtml(data ? data.complexity_override_id : '');
        });
    }

    function addModuleRow() {
        const tbody = document.getElementById('moduleRowsBody');
        const tr = document.createElement('tr');
        tr.className = 'module-row';
        tr.innerHTML = `
            <td>
                <input type="hidden" name="row_id[]" value="">
                <input type="text" name="zone[]" class="form-control zone-input" value="" list="moduleRowsZoneSuggestions" placeholder="Optional">
            </td>
            <td><select name="segment[]" class="form-select segment-select" required>${segmentOptionsHtml('')}</select></td>
            <td><select name="module_type[]" class="form-select module-type-select" required>${moduleTypeOptionsHtml('')}</select></td>
            <td><input type="number" name="count[]" class="form-control count-input" min="1" value="1" required></td>
            <td><select name="complexity_override[]" class="form-select complexity-select">${complexityOptionsHtml('')}</select></td>
            <td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger remove-row-btn" title="Remove row"><i class="bi bi-x-lg"></i></button></td>
        `;
        tbody.appendChild(tr);
    }

    document.getElementById('addModuleRowBtn').addEventListener('click', addModuleRow);
    document.getElementById('moduleRowsBody').addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-row-btn');
        if (btn) btn.closest('tr').remove();
    });

    hydrateExistingRows();
</script>
