{% extends 'estimator/base.html' %}

{% block title %}Delete {{ object }} - Estimator{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 560px; margin: 0 auto;">
    <div class="card">
        <div class="card-body text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            <h4 class="mt-3">Delete "{{ object }}"?</h4>
            <p class="text-muted">This can't be undone.</p>
            <form method="POST" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-trash me-2"></i>Delete
                </button>
                <a href="{% if request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}{% else %}{{ view.success_url }}{% endif %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
