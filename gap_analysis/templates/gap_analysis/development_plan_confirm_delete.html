{% extends 'gap_analysis/base.html' %}

{% block title %}Confirm Deletion | Skill Gap Analyzer{% endblock %}

{% block content %}
<div class="animate-fade-in">
    <div class="delete-card">
        <div class="card">
            <div class="card-body py-5">
                <div class="delete-icon"><i class="bi bi-exclamation-triangle"></i></div>
                <h2 class="delete-title">Delete Development Plan</h2>
                <p class="delete-message">
                    Delete the plan "{{ object.action }}" for {{ object.skill_matrix.name }} ({{ object.skill.name }})?
                </p>
                <form method="POST" class="btn-group-delete">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-2"></i>Yes, Delete Plan</button>
                    <a href="{% url 'skillgap_employee_profile' object.skill_matrix.id %}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-2"></i>Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
