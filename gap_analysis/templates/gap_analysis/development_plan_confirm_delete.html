{% extends 'gap_analysis/base.html' %}

{% block title %}Confirm Deletion | Skill Gap Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Deletion</h5>
            </div>
            <div class="card-body text-center py-5">
                <p class="fs-5">
                    Delete the plan "{{ object.action }}" for {{ object.skill_matrix.name }} ({{ object.skill.name }})?
                </p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'skillgap_employee_profile' object.skill_matrix.id %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete Plan</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
