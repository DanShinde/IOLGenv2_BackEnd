{% extends 'gap_analysis/base.html' %}

{% block title %}Confirm Deletion | Skill Gap Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Deletion</h5>
            </div>
            <div class="card-body text-center py-5">
                <p class="fs-5">
                    Are you sure you want to permanently delete
                    <strong>{{ object.skill.name }}</strong> for
                    <strong>{{ object.skill_matrix.name }}</strong>?
                </p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <a href="javascript:history.back()" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete Record</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
