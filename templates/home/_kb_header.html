<div class="kb-glass kb-header">
  <div class="kb-title">
    <div class="kb-logo"><i class="fas fa-book"></i></div>
    <div>
      <h1>Knowledge Base</h1>
      <p>Articles, Support Requests, and Bug Reports &amp; Features</p>
    </div>
  </div>
  <form class="kb-search" method="get" action="{% url 'forum-home' %}">
    <i class="fas fa-search"></i>
    <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search articles, support requests, or reports" />
    <input type="hidden" name="tab" value="{{ active_tab|default:'wiki' }}">
  </form>
  <a class="kb-action" href="{% url 'kb-create' %}">
    <i class="fas fa-plus"></i>
    Contribute
  </a>
</div>

<div class="kb-tabs">
  <a class="kb-tab {% if active_tab == 'wiki' %}active{% endif %}" href="{% url 'forum-home' %}?tab=wiki{% if query %}&q={{ query|urlencode }}{% endif %}">
    <i class="fas fa-book-open"></i>
    Wiki Articles
    <span>{{ total_articles }}</span>
  </a>
  <a class="kb-tab {% if active_tab == 'qa' %}active{% endif %}" href="{% url 'forum-home' %}?tab=qa{% if query %}&q={{ query|urlencode }}{% endif %}">
    <i class="fas fa-hands-helping"></i>
    Support Requests
    <span>{{ total_questions }}</span>
  </a>
  <a class="kb-tab {% if active_tab == 'reports' %}active{% endif %}" href="{% url 'forum-home' %}?tab=reports{% if query %}&q={{ query|urlencode }}{% endif %}">
    <i class="fas fa-bug"></i>
    Bug Reports and Features
    <span>{{ open_bugs|add:open_features }}</span>
  </a>
</div>
