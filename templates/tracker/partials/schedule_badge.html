{% load custom_tags %}{% if value is not None %}{% if value > 0 %}<span class="badge bg-danger">Delayed by {{ value }} day{{ value|pluralize }}</span>{% elif value < 0 %}<span class="badge bg-success">Ahead by {{ value|abs }} day{{ value|abs|pluralize }}</span>{% else %}<span class="badge bg-primary">On Time</span>{% endif %}{% else %}<span class="text-muted small">Not enough data</span>{% endif %}
